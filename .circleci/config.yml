          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target stunBinding -j2
      - run:
          name: Request STUN binding
          command: LIONSS_LP=1 ./build/stunBinding --conf stun.cfg --family ipv4

